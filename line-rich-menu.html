<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE 官方帳號｜圖文選單｜寒舍群</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --line-green: #00b900;
      --line-green-dark: #009e00;
      --brand-bg: #f7f7f7;
      --card-bg: #ffffff;
      --text-main: #222;
      --text-muted: #666;
      --border: #ececec;
      --accent: #ffca43;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: linear-gradient(180deg, #fbfbfb 0%, #f6f6f6 100%);
      color: var(--text-main);
    }

    .page-wrap {
      max-width: 1100px;
      margin: 50px auto;
      padding: 28px 20px 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--line-green), #3ddc72);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      box-shadow: 0 12px 25px rgba(0, 185, 0, 0.25);
    }

    .header-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--line-green), var(--line-green-dark));
      text-decoration: none;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 12px 24px rgba(0, 185, 0, 0.2);
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #eaf8ea 0%, #f6fbf3 50%, #fffaf0 100%);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 28px 22px 18px;
      box-shadow: var(--shadow);
    }

    .hero-badge {
      display: inline-block;
      background: rgba(0, 185, 0, 0.12);
      color: var(--line-green-dark);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .hero p {
      margin: 0;
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 720px;
      line-height: 1.8;
    }

    .hero .mini-stats {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 16px;
      padding: 12px 16px;
      min-width: 160px;
    }

    .stat strong {
      display: block;
      font-size: 1.3rem;
      color: var(--line-green-dark);
    }

    .menu-panel {
      margin-top: 28px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 22px 18px;
    }

    .menu-title {
      margin: 0 0 14px;
      font-weight: 900;
      font-size: 1.55rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 16px;
    }

    .menu-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 132px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: linear-gradient(180deg, #ffffff 0%, #fdfdfd 100%);
      text-decoration: none;
      color: var(--text-main);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }

    .menu-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 28px rgba(0, 0, 0, 0.08);
      border-color: rgba(0, 185, 0, 0.25);
      text-decoration: none;
      color: var(--text-main);
    }

    .menu-item::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, rgba(0,185,0,0.1), rgba(0,185,0,0.9), rgba(255,202,67,0.8));
    }

    .menu-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 18px 12px;
      z-index: 1;
    }

    .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(0,185,0,0.1), rgba(255,202,67,0.15));
      color: var(--line-green-dark);
      font-size: 1.8rem;
      font-weight: 700;
    }

    .menu-text {
      font-weight: 700;
      font-size: 1.02rem;
      letter-spacing: 0.02em;
    }

    .menu-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .footer-note {
      margin-top: 26px;
      color: var(--text-muted);
      text-align: center;
      font-size: 0.95rem;
    }

    @media (max-width: 820px) {
      .menu-grid { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
    }

    @media (max-width: 540px) {
      .page-wrap { margin: 24px auto 40px; padding: 16px 12px 30px; }
      .menu-grid { grid-template-columns: 1fr; }
      .hero { padding: 20px 14px 14px; }
      .hero h1 { font-size: 2.1rem; }
      .topbar { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="topbar">

      <div class="mini-stats">

        <div class="stat"><strong>6項</strong> 主要服務</div>

    <section class="menu-panel">
      <h2 class="menu-title">

      <div class="menu-grid">
        <a class="menu-item" href="https://lin.ee/pW8Sw2F" target="_blank" rel="noopener noreferrer">
          <div class="menu-inner">
            <div class="icon-wrap">💬</div>
            <div class="menu-text">加入好友</div>
            <div class="menu-sub">立即聊聊</div>
          </div>
        </a>

        <a class="menu-item" href="https://docs.google.com/forms/d/e/1FAIpQLSeCOQFdVwTcO2GMFBZGq_Jwo10uvlZ6RrZistFbFv9buNhlJA/viewform" target="_blank" rel="noopener noreferrer">
          <div class="menu-inner">
            <div class="icon-wrap">📅</div>
            <div class="menu-text">預約諮詢</div>
            <div class="menu-sub">快速安排</div>
          </div>
        </a>

        <a class="menu-item" href="goal.html" target="_blank" rel="noopener noreferrer">
          <div class="menu-inner">
            <div class="icon-wrap">🛍️</div>
            <div class="menu-text">購物商城</div>
            <div class="menu-sub">瀏覽商品</div>
          </div>
        </a>

        <a class="menu-item" href="index.html#about" target="_blank" rel="noopener noreferrer">
          <div class="menu-inner">
            <div class="icon-wrap">✨</div>
            <div class="menu-text">關於我們</div>
            <div class="menu-sub">品牌故事</div>
          </div>
        </a>

        <a class="menu-item" href="disclaimer.html" target="_blank" rel="noopener noreferrer">
          <div class="menu-inner">

        <a class="menu-item" href="index.html#footer" target="_blank" rel="noopener noreferrer">
          <div class="menu-inner">

    </section>

    <p class="footer-note">適用於 LINE 官方帳號首頁，可直接套用為正式圖文選單版型。</p>
  </div>
</body>
</html>
